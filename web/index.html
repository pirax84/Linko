["8. Données personnelles",["Linko traite : votre identifiant de connexion, votre nom d’affichage, votre numéro de téléphone si vous l’utilisez pour vous connecter, vos liens, catégories, relations d’amis et notifications. Ces données servent uniquement à faire fonctionner le service, à le sécuriser et à vous prévenir. Elles ne sont pas vendues.","Vous pouvez demander l’accès, la correction, l’effacement, la portabilité de vos données ou vous opposer à leur traitement en écrivant à [e-mail de contact]. Vous pouvez aussi saisir la CNIL.","Un lien ou un QR code que vous partagez est visible par les personnes qui le reçoivent ou le scannent.","Dans cette version de test, vos données restent sur votre appareil."]],

["5. Prohibited content and uses",["You may not use Linko for unlawful content or links: glorification of crimes, terrorism, child sexual abuse material, incitement to hatred or violence, harassment, scams or phishing, malware, invasion of privacy, counterfeiting.","You may not use a QR code to mislead someone about where a link leads."]],

["7. Linko’s liability",["To the maximum extent allowed by law, Linko, as a mere technical host, is not liable for the content or links saved, shared or opened through the service, for any resulting damage, or for the content and availability of third-party sites.","Linko can only be held liable where the law requires it, in particular if, having actual knowledge of manifestly unlawful content, it does not remove it promptly.","The service is provided “as is”, with no guarantee of permanent availability. Remember to export your links from time to time.","Nothing in these terms excludes or limits Linko’s liability for gross negligence or intentional misconduct, for personal injury, or the rights the law gives you as a consumer."]],
["8. Personal data",["Linko processes: your sign-in identifier, your display name, your phone number if you use it to sign in, your links, categories, friend relationships and notifications. This data is only used to run and secure the service and to notify you. It is not sold.","You can ask for access, correction, erasure or portability of your data, or object to its processing, by writing to [contact email]. You may also contact the CNIL.","A link or QR code you share is visible to the people who receive or scan it.","In this test version, your data stays on your device."]],

let DICT=null;
function dictate(cb,btn){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){toast(t("dict_none"));return}
 if(DICT){try{DICT.stop()}catch(e){}return}
 const r=new SR();r.lang=L==="en"?"en-US":"fr-FR";r.interimResults=false;r.maxAlternatives=1;DICT=r;
 if(btn){btn.classList.add("on");btn.setAttribute("aria-pressed","true")}
 toast(t("mm_listening"));
 const end=()=>{DICT=null;if(btn){btn.classList.remove("on");btn.setAttribute("aria-pressed","false")}};
 r.onresult=e=>{const tx=(e.results[0]&&e.results[0][0]&&e.results[0][0].transcript||"").trim();if(tx)cb(tx);else toast(t("dict_err"))};
 r.onerror=()=>{toast(t("dict_err"))};r.onend=end;
 try{r.start()}catch(e){end();toast(t("dict_none"))}}

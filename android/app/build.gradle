plugins { id 'com.android.application' }
android {
    namespace 'app.linko'
    compileSdk 34
    defaultConfig {
        applicationId 'app.linko'
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName '1.11'
    }
    signingConfigs {
        release {
            storeFile file('../keystore/linko.jks')
            storePassword 'linko-app-2026'
            keyAlias 'linko'
            keyPassword 'linko-app-2026'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }

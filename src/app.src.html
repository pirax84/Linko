<style>

/* mise en page */
.shell{display:block}
.rail{display:none}
.page{padding:max(.75rem,env(safe-area-inset-top)) 1rem calc(7rem + env(safe-area-inset-bottom));max-width:46rem;margin:0 auto}

function qrSvg(text){
 const q=qrcode(0,"H");q.addData(text);q.make();const n=q.getModuleCount(),Z=4,W=n+2*Z,Hh=W+4.4;
 const inF=(r,c)=>(r<7&&c<7)||(r<7&&c>=n-7)||(r>=n-7&&c<7);
 const half=Math.max(2,Math.floor(n*0.095)),mid=n/2;
 const inL=(r,c)=>Math.abs(r+.5-mid)<=half+1&&Math.abs(c+.5-mid)<=half+1;
 let d="";const R=.47;
 for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c)&&!inF(r,c)&&!inL(r,c))d+=`M${Z+c+.5-R} ${Z+r+.5}a${R} ${R} 0 1 0 ${2*R} 0a${R} ${R} 0 1 0 ${-2*R} 0`;
 const col="#1E3A9E";
 let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${Hh}" width="${W*10}" height="${Hh*10}"><rect width="${W}" height="${Hh}" rx="3.2" fill="#F4F7FB"/><path d="${d}" fill="${col}"/>`;
 [[0,0],[n-7,0],[0,n-7]].forEach(([x,y])=>{s+=`<rect x="${Z+x}" y="${Z+y}" width="7" height="7" rx="1.6" fill="${col}"/><rect x="${Z+x+1}" y="${Z+y+1}" width="5" height="5" rx="1" fill="#F4F7FB"/><rect x="${Z+x+2}" y="${Z+y+2}" width="3" height="3" rx=".8" fill="${col}"/>`});
 const ts=2*half+1.7,tx=Z+mid-ts/2,m=ts-1.3;
 s+=`<rect x="${tx}" y="${tx}" width="${ts}" height="${ts}" rx="1.5" fill="#fff"/><svg x="${tx+.65}" y="${tx+.65}" width="${m}" height="${m}" viewBox="0 0 64 64"><path d="M16 6V44Q16 58 30 58H54" fill="none" stroke="#2B5CE6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="35" cy="33" r="9" fill="#2B5CE6"/></svg>`;
 s+=`<rect x="${W/2-6}" y="${W+.5}" width="12" height="3.2" rx="1.6" fill="#2B5CE6"/><text x="${W/2}" y="${W+2.75}" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="2.1" fill="#fff" text-anchor="middle">Linko</text></svg>`;
 return s}

/* ---------- favoris par thèmes + recettes ---------- */

const UNI="pots?|g|kg|mg|cl|ml|l|dl|cs|cc|c\\.?\\s?à\\s?(?:s|c|soupe|café)\\.?|cuill?[èe]res?(?:\\s+à\\s+(?:soupe|café))?|tasses?|verres?|pincées?|gousses?|tranches?|sachets?|boîtes?|brins?|feuilles?|tbsp|tsp|cups?|oz|lb";
const RQ=new RegExp("^[-•*–·]?\\s*((?:\\d+(?:[.,/]\\d+)?|[½¼¾])(?:\\s*(?:-|à)\\s*\\d+(?:[.,]\\d+)?)?\\s*(?:(?:"+UNI+")(?![a-zà-ÿ]))?)\\s*(?:de\\s+|d['’]\\s*)?(.+)$","i");
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
function parseIng(line){line=line.trim();if(!line)return null;const m=line.match(RQ);return m&&m[2].trim()?{n:cap(m[2].trim()),q:m[1].trim()}:{n:cap(line.replace(/^[-•*–·]\s*/,"")),q:"",miss:true}}
function parseRec(text,title){
 const L=String(text||"").split(/\n+/).map(x=>x.trim()).filter(Boolean);let mode="",ings=[],steps=[],prep=null,cook=null,serv=null;
 const mins=(n,u)=>/h/i.test(u)?+n*60:+n;
 let ttl="";
 for(let ix=0;ix<L.length;ix++){const ln=L[ix];
  let m;
  if(ix===0&&!RQ.test(ln)&&!/^[-•*]/.test(ln)&&!/:/.test(ln)&&ln.length<=60&&!/[.!]$/.test(ln)&&!/^(pr[ée]paration|[ée]tapes?|recette|instructions?|ingr)/i.test(ln)){ttl=ln.replace(/#\S+/g,"").trim();continue}
  if((m=ln.match(/pr[ée]p\w*\s*:?\s*(\d+)\s*(min|h)/i)))prep=mins(m[1],m[2]);
  if((m=ln.match(/cuisson\s*:?\s*(\d+)\s*(min|h)/i)))cook=mins(m[1],m[2]);
  if((m=ln.match(/(\d+)\s*(?:personnes|pers\b|portions|parts|servings)/i)))serv=+m[1];
  if((m=ln.match(/^(?:ingr[ée]dients?|il faut|you need)\s*:?\s*(.*)$/i))){mode="ing";if(m[1])m[1].split(/\s*[,;]\s*/).forEach(x=>{const i=parseIng(x);i&&ings.push(i)});continue}

 <h4>${t("vb_last")}</h4><div class="vbl">${msgs.length?msgs.map(m=>m.type==="v"?`<div class="row2"><button class="rb o" data-vb="play" data-id="${m.id}" aria-label="${esc(t("v_play",{n:m.me?t("vb_me"):fById(fid).n,d:fmt(m.dur)}))}">${ic(VB.playId===m.id?"ic-stop":"ic-play")}</button><span class="g">${m.me?t("vb_me"):esc(fById(fid).n)} · ${fmt(m.dur)} · ${hhmm(m.at)}</span><button class="rb o" data-vb="share" data-id="${m.id}" aria-label="${t("vb_share")}">${ic("ic-share")}</button></div>`:`<div class="row2"><span class="g"><b>${m.me?t("vb_me"):esc(fById(fid).n)}</b> · ${esc(m.k?t(m.k):m.txt)}</span></div>`).join(""):`<p class="mut" style="font-size:.85rem">${t("vb_none")}</p>`}</div>
 <button class="setrow" data-vb="pf" aria-expanded="${!!VB.pf}" style="margin-top:.5rem"><span class="g"><b>${t("vb_prefs")}</b></span>${ic(VB.pf?"ic-up":"ic-dn")}</button>
 ${VB.pf?`<button class="setrow" role="switch" aria-checked="${S.set.vbAuto!==false}" data-vb="auto"><span class="g"><b>${t("vb_auto")}</b><small>${t("vb_auto_d")}</small></span><span class="sw" aria-hidden="true"></span></button>
 <div class="seg" role="group" aria-label="${t("vb_rate")}">${VBR.map(r=>`<button data-vb="rate" data-id="${r}" aria-pressed="${(S.set.vbRate||1)===r}">${r}×</button>`).join("")}</div>
 <p class="mut" style="font-size:.8rem">${t("vb_kept")}</p>`:""}`;
}
function vbOpen(o){VB.open=o;if(o)VB.nw=false;if(!o&&VB.rec)vbCancel(true);if(!o)vbStopAudio();vbPaint();if(o){vbPanel();const m=$(".vbmic");m&&m.focus({preventScroll:true})}else{const b=$(".vbb");b&&b.focus({preventScroll:true})}}
function vbBind(b){
 let d=null;
 b.addEventListener("pointerdown",e=>{d={x:e.clientX,y:e.clientY,p:vbPos(),mv:false};try{b.setPointerCapture(e.pointerId)}catch(_){}});
 b.addEventListener("pointermove",e=>{if(!d)return;const dx=e.clientX-d.x,dy=e.clientY-d.y;if(!d.mv&&Math.hypot(dx,dy)<8)return;d.mv=true;S.vbPos={x:d.p.x+dx,y:d.p.y+dy};const p=vbPos();b.style.left=p.x+"px";b.style.top=p.y+"px";if(VB.open)vbPanel()});
 b.addEventListener("pointerup",e=>{if(!d)return;const mv=d.mv;d=null;if(mv){const p=vbPos();S.vbPos=p;save0()}else vbOpen(!VB.open)});
 b.addEventListener("pointercancel",()=>{d=null});
 b.addEventListener("keydown",e=>{const st=24,m={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[e.key];
  if(m&&e.shiftKey){e.preventDefault();const p=vbPos();S.vbPos={x:p.x+m[0],y:p.y+m[1]};S.vbPos=vbPos();save0();vbPaint();if(VB.open)vbPanel()}
  else if(e.key==="Enter"||e.key===" "){e.preventDefault();vbOpen(!VB.open)}});
 document.addEventListener("keydown",e=>{if(e.key==="Escape"&&VB.open&&!sheetOpen)vbOpen(false)});
 document.addEventListener("click",e=>{const x=e.target.closest&&e.target.closest("[data-vb]");if(!x)return;e.preventDefault();const a=x.dataset.vb,id=x.dataset.id;
  switch(a){case"close":vbOpen(false);break;
  case"to":VB.fid=id;S.set.vbTo=id;save0();vbPanel();break;
  case"main":if(VB.rec)vbSend();else if(VB.st==="play")vbStopAudio(),vbPanel();else vbRecStart().then(vbPanel);break;
  case"pause":vbPauseTog();break;case"mute":vbMuteTog();break;case"again":vbAgain();break;case"cancel":vbCancel();break;
  case"play":vbPlay(id).then(vbPanel);vbPanel();break;case"share":vbShare(id);break;
  case"auto":S.set.vbAuto=S.set.vbAuto===false;save0();vbPanel();break;
  case"pf":VB.pf=!VB.pf;vbPanel();break;
  case"rate":S.set.vbRate=+id;save0();if(VB.au)VB.au.playbackRate=+id;vbPanel();break}});
 addEventListener("resize",()=>{vbPaint();if(VB.open)vbPanel()});
}
const _r2=render;render=function(){_r2();vbPaint()};
const _a5=act2;
act2=function(a,id,el){
 switch(a){
 case"vplay":vbPlay(id);return true;
 case"tog":if(id==="vb"){S.set.vb=S.set.vb===false;save();render();return true}break;
 case"vbreset":S.vbPos=null;save0();vbPaint();toast(t("vb_reset"));return true;
 }
 return _a5(a,id,el)};
vbPaint();

/* ===== Vignettes des favoris : vraie image d'abord, fond bleu en dernier recours ===== */
const thumbOf=l=>(l&&(l.img||""))||"";
const thumbImg=l=>thumbOf(l)?`<img class="tim" src="${esc(thumbOf(l))}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">`:"";
const proxyImg=u=>"https://images.weserv.nl/?w=640&output=jpg&url="+encodeURIComponent(u.replace(/^https?:\/\//,""));
function imgFromHtml(h,base){if(!h)return"";let doc;try{doc=new DOMParser().parseFromString(h,"text/html")}catch(e){return""}
 const g=q=>{const e=doc.querySelector(q);return e?(e.getAttribute("content")||e.getAttribute("href")||"").trim():""};
 let c=[g('meta[property="og:image:secure_url"]'),g('meta[property="og:image"]'),g('meta[name="twitter:image"]'),g('meta[name="twitter:image:src"]'),g('link[rel="image_src"]')];
 doc.querySelectorAll('script[type="application/ld+json"]').forEach(x=>{try{const o=JSON.parse(x.textContent);[].concat(o,o["@graph"]||[]).forEach(z=>{if(!z)return;let i=z.thumbnailUrl||z.image;i=Array.isArray(i)?i[0]:i;if(i&&typeof i==="object")i=i.url;if(i)c.push(String(i))})}catch(e){}});
 const m=h.match(/"(?:thumbnailUrl|cover|originCover)":"(https?:[^"]+)"/);if(m)try{c.push(JSON.parse('"'+m[1]+'"'))}catch(e){}
 for(const i of c){if(!i)continue;try{return new URL(i.replace(/&amp;/g,"&"),base).href}catch(e){}}return""}
async function getText(u){if(hasNative())return nativeFetch(u);if(!/^https:\/\/(noembed\.com|api\.microlink\.io|www\.tiktok\.com\/oembed)/.test(u))return"";try{const c=new AbortController();setTimeout(()=>c.abort(),8000);const r=await fetch(u,{signal:c.signal});return await r.text()}catch(e){return""}}
async function oembedImg(u){const eps=[];if(/tiktok\.com/i.test(u))eps.push("https://www.tiktok.com/oembed?url="+encodeURIComponent(u));eps.push("https://noembed.com/embed?url="+encodeURIComponent(u));
 for(const e of eps){try{const j=JSON.parse(await getText(e));if(j&&j.thumbnail_url)return j.thumbnail_url}catch(x){}}return""}
async function microImg(u){try{const j=JSON.parse(await getText("https://api.microlink.io/?url="+encodeURIComponent(u)));const d=j&&j.data;return(d&&((d.image&&d.image.url)||(d.logo&&0)))||""}catch(e){return""}}
function imgLoads(u){return new Promise(res=>{if(!u)return res(false);const i=new Image();i.referrerPolicy="no-referrer";const to=setTimeout(()=>res(false),9000);i.onload=()=>{clearTimeout(to);res(i.naturalWidth>40)};i.onerror=()=>{clearTimeout(to);res(false)};i.src=u})}
/* Ordre : YouTube (direct) -> meta de la page -> oEmbed -> service de secours ; chaque image est testee, puis via un proxy si elle est bloquee */
async function fetchThumb(l){const u=l.url,cands=[];const y=ytId(u);if(y)cands.push(()=>"https://i.ytimg.com/vi/"+y+"/hqdefault.jpg");
 if(l.rec&&l.rec.img)cands.push(()=>l.rec.img);
 cands.push(async()=>imgFromHtml(await getText(u),u),()=>oembedImg(u),()=>microImg(u));
 for(const f of cands){let i="";try{i=await f()}catch(e){}if(!i)continue;if(await imgLoads(i))return i;const p=proxyImg(i);if(await imgLoads(p))return p}return""}
function patchThumb(l){document.querySelectorAll('.fim[data-id="'+l.id+'"]').forEach(f=>{f.querySelectorAll("img.tim").forEach(x=>x.remove());const th=f.querySelector(".th");if(thumbOf(l)){f.insertAdjacentHTML("afterbegin",thumbImg(l));if(th)th.remove()}})}
let thumbBusy=false;
async function thumbScan(){if(thumbBusy)return;thumbBusy=true;try{const now=Date.now();
 for(const l of S.links.slice()){if(l.reported||thumbOf(l))continue;if(l.imgNo&&now-l.imgNo<864e5)continue;
  const i=await fetchThumb(l);if(i){l.img=i;delete l.imgNo;delete l.imgRetry}else l.imgNo=Date.now();save0&&save0();patchThumb(l);await new Promise(r=>setTimeout(r,250))}}finally{thumbBusy=false}}
document.addEventListener("error",e=>{const im=e.target;if(!im||!im.classList||!im.classList.contains("tim"))return;const f=im.closest(".fim"),l=f&&S.links.find(x=>x.id===f.dataset.id);if(!l)return;
 const was=l.img;l.img="";if(!l.imgRetry){l.imgRetry=1;if(was&&!/weserv/.test(was)){l.img=proxyImg(was);patchThumb(l);return}}
 l.imgNo=0;patchThumb(l);setTimeout(thumbScan,200)},true);
setTimeout(thumbScan,1500);
if(!S.auth)S.step="main";render();incoming();if(S.auth&&S.sync&&S.sync.tok)setTimeout(()=>syncNow(false),1500);

window.__linko={px:pxRun,pxRows,vb:()=>VB,S:()=>S,syncNow,qrSvg,thumbScan,fetchThumb,tmNew:(l,m)=>{tmNew(l,m);render()},tick};
})();
